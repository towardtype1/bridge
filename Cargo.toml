[workspace]
resolver = "3"
members = [
    "crates/bridge-core",
    "crates/bridge-compat",
    "crates/bridge-engine",
    "crates/bridge-git",
    "crates/bridge-tactical",
    "crates/bridge-hook-helper",
    "crates/bridge-computer",
    "crates/bridge-stations",
    "crates/bridge-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/towardtype1/bridge"

[workspace.dependencies]
bridge-core = { path = "crates/bridge-core" }
bridge-compat = { path = "crates/bridge-compat" }
bridge-engine = { path = "crates/bridge-engine" }
bridge-git = { path = "crates/bridge-git" }
bridge-tactical = { path = "crates/bridge-tactical" }
bridge-computer = { path = "crates/bridge-computer" }
bridge-stations = { path = "crates/bridge-stations" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
tokio = { version = "1.52", features = ["full"] }
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
eframe = "0.35"
ureq = { version = "3.3", features = ["json"] }
regex = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
dirs = "6.0"

# dev
proptest = "1.11"
tempfile = "3.27"

[profile.release]
lto = "thin"
